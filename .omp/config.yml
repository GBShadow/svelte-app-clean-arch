# Configuração local do OMP (oh-my-pi) para o svelte-app.
# Modelos herdados da matriz global definida no agent-memory (~/.omp/agent/config.yml).

# Permissões (espelho do .opencode/opencode.jsonc)
#   edit: allow | bash: "*": ask (allowlist abaixo) | webfetch: allow
tools:
  approvalMode: write # auto-approve read + workspace-write; bash pede confirmação
  approval:
    edit: allow
    bash: prompt
    fetch: allow # webfetch

bash:
  patterns:
    - match: "pnpm *"
      approval: allow
    - match: "pnpm"
      approval: allow
    - match: "npm run *"
      approval: allow
    - match: "npm"
      approval: allow
    - match: "git status*"
      approval: allow
    - match: "git diff*"
      approval: allow
    - match: "git log*"
      approval: allow
    - match: "git branch*"
      approval: allow
    - match: "git show*"
      approval: allow
    - match: "git ls*"
      approval: allow
    - match: "ls *"
      approval: allow
    - match: "touch *"
      approval: allow
    - match: "cat *"
      approval: allow
